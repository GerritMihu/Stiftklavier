name: KiBot Export (KiCad 10 Docker)
on: [push, pull_request]

jobs:
  export:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/inti-cmnb/kibot-docker:kicad-10  # Offizieller KiBot-Container für KiCad 10
    steps:
      - uses: actions/checkout@v4

      - name: cam-Ordner erstellen
        run: mkdir -p cam

      - name: KiCad-Daten exportieren
        run: kibot -c .kibot.yml -d cam/

      - name: Ergebnisse commiten
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add cam/
          git commit -m "Automatisch generierte KiBot-Exporte (KiCad 10 Docker)" || true
          git push || true